name: Java e SQL Server
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CiTest_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiTest_2026!' -C -b -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=30 --health-start-period=30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Criar banco exclusivo de teste
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiTest_2026!' -C -b -Q 'CREATE DATABASE leite_solidario_test'
      - name: Compilar e testar com SQL Server
        env:
          IT_DB_PASSWORD: CiTest_2026!
        run: ./mvnw -B -Psqlserver-it verify
